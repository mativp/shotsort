name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The oldest Node the manifest claims to support, the current LTS, and the latest.
        node-version: ['18', '20', '22', '24']
        os: [ubuntu-latest]
        include:
          # The files it sorts come off cameras onto macOS and Windows as often as Linux,
          # and the path handling is the part most likely to differ.
          - { node-version: '22', os: macos-latest }
          - { node-version: '22', os: windows-latest }

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run lint
      - run: npm test

  coverage:
    # The floors the badges in the README state. They are a floor, not a target: a change
    # that adds a branch nothing checks fails here rather than quietly lowering the number.
    # Pinned to one Node because the threshold flags only exist from Node 22.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run coverage:check
