name: test

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs this whole matrix again before it publishes, so a version
  # never reaches npm on the strength of a green run from some earlier commit.
  workflow_call:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The oldest Node the manifest claims to support, the LTS most people are on,
        # and the one that becomes LTS next -- so a release that breaks on it is found
        # before anyone upgrades into the breakage.
        node-version: ['22', '24', '26']
        os: [ubuntu-latest]
        include:
          # The files it sorts come off cameras onto Windows as often as Linux, and the
          # path handling is the part most likely to differ.
          - { node-version: '22', os: windows-latest }

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run lint
      - run: npm test

  coverage:
    # The floors the badges in the README state. They are a floor, not a target: a change
    # that adds a branch nothing checks fails here rather than quietly lowering the number.
    # Pinned to the oldest Node the manifest supports, which is where the coverage
    # threshold flags first exist anyway.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run coverage:check
